[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataharmonizer-template-builder"
version = "0.1.0"
description = "Browser-based editor for DataHarmonizer LinkML schemas using Schemasheets tables."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "MIMICC contributors" }
]
dependencies = []

[project.optional-dependencies]
app = [
  "Django>=5,<6",
  "django-cors-headers",
  "gunicorn",
  "pydantic>=2",
  "linkml>=1.7",
  "linkml-runtime>=1.8",
  "linkml-lib @ git+https://github.com/timrozday-mgnify/linkml-lib.git@v0.1.0",
  "dh-builder-lib @ git+https://github.com/timrozday-mgnify/dh-builder.git@v0.1.0",
  "pyyaml>=6",
  "schemasheets>=0.4",
]
dev = [
  "httpx",
  "playwright",
  "pre-commit",
  "pytest",
  "pytest-playwright",
]

[project.scripts]
dh-template-builder = "dataharmonizer_template_builder.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../linkml-lib/src", "../dh-builder"]
