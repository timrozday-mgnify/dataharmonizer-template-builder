[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataharmonizer-template-builder"
version = "0.1.0"
description = "Browser-based editor for DataHarmonizer LinkML schemas using editable tables."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "MIMICC contributors" }
]
dependencies = []

[project.optional-dependencies]
app = [
  "Django>=5,<6",
  "django-cors-headers",
  "gunicorn",
  "pydantic>=2",
  "linkml>=1.7",
  "linkml-runtime>=1.8",
  "linkml-lib @ git+https://github.com/timrozday-mgnify/linkml-lib.git@v0.1.0",
  "dh-builder-lib @ git+https://github.com/timrozday-mgnify/dh-builder.git@v0.1.0",
  "pyyaml>=6",
]

# Standardised dev group across the MIMICC/ENA repos; `uv sync` installs it by
# default, so CI needs no extra flag for it.
[dependency-groups]
dev = [
  "httpx",
  "mypy>=1.14",
  "playwright",
  "pre-commit>=4",
  "pytest",
  "pytest-playwright",
  "ruff>=0.16",
  "types-PyYAML",
]

[project.scripts]
dh-template-builder = "dataharmonizer_template_builder.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../linkml-lib/src", "../dh-builder"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"

# None of these ship a py.typed marker.
[[tool.mypy.overrides]]
module = ["django.*", "linkml.*", "linkml_runtime.*", "linkml_lib.*", "dh_builder_lib.*", "corsheaders.*"]
ignore_missing_imports = true
